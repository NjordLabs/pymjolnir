name: CodeQL

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: pirlruc/pydevops/.github/workflows/python-codeql.yml@f0fff3a920d8cdf92f60cc1d2999273424793335
    with:
      queries: security-extended
