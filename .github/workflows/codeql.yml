name: CodeQL

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: pirlruc/pydevops/.github/workflows/python-codeql.yml@efef9824f9c61698334a5926b79017babaf1add7
    with:
      queries: security-extended
