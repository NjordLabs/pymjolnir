name: Repository checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-pins-verify.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a

  threshold-drift:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-threshold-drift.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
    secrets:
      checkout_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  scaffold:
    permissions:
      contents: read
      issues: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      blocking: true
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
      packs_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  docs:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      blocking: true
      shell_scripts: scripts/*.sh
      ruff_paths: scripts/lint-doc-links.py
      yaml_files: docs/issues.yml docs/guardrail-deviations.yml docs/issues-sync-targets.yml
      yaml_globs: .github/workflows/*.yml
      run_link_lint: true
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  dependency-review:
    permissions:
      contents: read
      pull-requests: read
    uses: pirlruc/commondevops/.github/workflows/common-dependency-review.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a

  scorecard:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      blocking: false

  token-audit:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
