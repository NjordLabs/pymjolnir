name: Repository checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-pins-verify.yml@ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    with:
      scripts_ref: ff65e7efbb7eea67bd659f886db0adb399f3a3f5

  threshold-drift:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-threshold-drift.yml@ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    with:
      scripts_ref: ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    secrets:
      checkout_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  scaffold:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      issues: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    with:
      blocking: true
      scripts_ref: ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
      packs_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  docs:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    with:
      blocking: true
      shell_scripts: scripts/*.sh
      ruff_paths: scripts/lint-doc-links.py
      yaml_files: docs/issues.yml docs/guardrail-deviations.yml docs/issues-sync-targets.yml
      yaml_globs: .github/workflows/*.yml
      run_link_lint: true
      run_hygiene: true
      hygiene_owners: pirlruc,NjordLabs
      hygiene_allowed_repos: pirlruc/*,NjordLabs/*
      scripts_ref: ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  dependency-review:
    permissions:
      contents: read
      pull-requests: read
    uses: pirlruc/commondevops/.github/workflows/common-dependency-review.yml@ff65e7efbb7eea67bd659f886db0adb399f3a3f5

  scorecard:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    with:
      blocking: false

  token-audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    with:
      scripts_ref: ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
