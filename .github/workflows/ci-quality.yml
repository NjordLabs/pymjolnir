name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    permissions:
      actions: write
      contents: read
      packages: read
      pull-requests: write
      security-events: write
    uses: pirlruc/pydevops/.github/workflows/python-quality.yml@84bf54b8fed97ff1db4760847af1842e23fa7dc3
    with:
      devops_repository: pirlruc/pydevops
      devops_ref: 84bf54b8fed97ff1db4760847af1842e23fa7dc3
      strictness_level: High
      docstring_format: Google
      python_version: "3.13"
      python_versions: '["3.13"]'
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.PYDEVOPS_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
