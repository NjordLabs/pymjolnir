name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    permissions:
      actions: write
      contents: write
      packages: read
      pull-requests: write
      security-events: write
    uses: pirlruc/pydevops/.github/workflows/python-quality.yml@a052907757b41d09f7c9844a7cb34a57cd6ef25a
    with:
      devops_repository: pirlruc/pydevops
      devops_ref: a052907757b41d09f7c9844a7cb34a57cd6ef25a
      strictness_level: High
      docstring_format: Google
      python_version: "3.13"
      python_versions: '["3.13"]'
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.PYDEVOPS_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
