name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: write
      contents: read
      packages: read
      pull-requests: write
      security-events: write
    uses: pirlruc/pydevops/.github/workflows/python-quality.yml@ce31af67d4b236e42298e9ba6f2984e60ab4ddff
    with:
      devops_repository: pirlruc/pydevops
      devops_ref: ce31af67d4b236e42298e9ba6f2984e60ab4ddff
      strictness_level: High
      docstring_format: Google
      python_version: "3.13"
      python_versions: '["3.13", "3.14"]'
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.PYDEVOPS_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
