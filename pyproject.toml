[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1", "wheel>=0.47.0"]

[project]
name = "pymjolnir"
version = "0.1.2"
dependencies = []
requires-python = ">=3.13"
authors = [{name = "pirlruc"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
description = "Design patterns Python library"
keywords = ["design-patterns", "patterns", "python"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[dependency-groups]
dev = [
  "bandit[toml]==1.9.4",
  "commitizen>=3.0",
  "coverage[toml]>=7.13.5",
  "hypothesis>=6.140",
  "interrogate>=1.7.0",
  "mypy>=1.20.2",
  "pip-audit>=2.9",
  "pydantic>=2.0",
  "pylint>=4.0.9",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "radon>=6.0.1",
  "ruff==0.15.12",
]

[project.urls]
Changelog = "https://github.com/NjordLabs/pymjolnir/blob/main/CHANGELOG.md"
Issues = "https://github.com/NjordLabs/pymjolnir/issues"
Repository = "https://github.com/NjordLabs/pymjolnir"

[tool.interrogate]
fail-under = 95
ignore-nested-classes = true
ignore-nested-functions = true
ignore-private = true
ignore-semiprivate = true

[tool.bandit]
exclude_dirs = [".venv", "build", "dist", "tests", "scripts", "docs", ".github"]

# Release flow: local `cz bump` → push tag → GitHub "Release" workflow → optional manual PyPI.
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "pep621"

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
exclude = ["(^|/)docs/", "(^|/)\\.github/", "(^|/)scripts/"]
explicit_package_bases = true
mypy_path = ["src"]
namespace_packages = true
no_implicit_optional = true
python_version = "3.13"
show_error_codes = true
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = "tests.*"

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = "hypothesis"

[[tool.mypy.overrides]]
disallow_untyped_decorators = false
module = "tests.test_registry_properties"

[tool.coverage.run]
branch = true
source = ["pymjolnir"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.pylint.format]
max-line-length = 100

[tool.pylint.main]
ignore = [".venv", "build", "dist"]
py-version = "3.13"
source-roots = ["src"]

[tool.pylint.messages_control]
disable = [
  "too-few-public-methods",
  "unnecessary-ellipsis",
]

[tool.ruff]
line-length = 100
preview = true
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "D",
  "DOC",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.pydoclint]
# Mirrors former pydoclint CLI intent: validate docstrings against signatures.
# Return/yield/exception coverage is enforced by DOC2xx / DOC4xx / DOC5xx rules.
ignore-one-line-docstrings = false

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["D", "DOC"]
"tests/**" = ["D", "DOC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.package-data]
pymjolnir = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
